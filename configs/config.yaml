# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  # All images are resized to image_size x image_size on-the-fly during training
  # (via T.Resize in augmentation.py).  The original sizes per dataset are:
  #   combine_asl:  400x400 px (enforced by cleanup scripts)
  #   asl_hg_raw:   variable  (raw capture, different devices)
  #   asl_alphabet: 200x200 px (after thinning via delete_archive_train.py)
  image_size: 224
  min_image_size: 32     # drop images smaller than this (px, either dim)
  phash_threshold: 5     # Hamming distance <= this -> near-duplicate
  phash_hash_size: 8     # 64-bit pHash
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  random_seed: 33
  cache_resized: false   # enable on Colab to cache pre-resized images locally

# ---------------------------------------------------------------------------
# DataLoader
# ---------------------------------------------------------------------------
dataloader:
  local:
    batch_size: 64
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  colab:
    batch_size: 128
    num_workers: 2
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  kaggle:
    batch_size: 128
    num_workers: 2
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  num_epochs: 30
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  grad_accum_steps: 1
  early_stopping_patience: 7
  use_amp: true
  use_weighted_sampler: false
  use_class_weights: true
  scheduler: cosine      # cosine | step | none
  torch_compile: false

# ---------------------------------------------------------------------------
# Transfer learning
# ---------------------------------------------------------------------------
transfer:
  freeze_epochs: 5
  backbones:
    - resnet18
    - resnet50
    - mobilenet_v3_small
    - efficientnet_b0
