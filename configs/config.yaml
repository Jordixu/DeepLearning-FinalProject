# Cluster configuration for Pirineus 3 (CSUC HPC).
# Environment auto-detected via SLURM_JOB_ID or ASL_ENV=cluster.
#
# All data, results, checkpoints, and weights live under $HOME/.
# Expected layout:
#   $HOME/asl/                  ← this project
#   $HOME/asl_shards/           ← WebDataset tar shards (train/ val/ test/)
#   $HOME/pretrained_weights/   ← flat .pth weight files (no subfolders)
#   $HOME/results/              ← training outputs
#   $HOME/checkpoints/          ← saved model checkpoints
#
# See README.md for full setup instructions.

debug: false

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  local:
    data_root: data/
    results_root: results/
    checkpoints_root: checkpoints/
  cluster:
    data_root: "$DATA"
    results_root: "$HOME/results"
    checkpoints_root: "$HOME/checkpoints"
    weights_dir: "$DATA/pretrained_weights"

# Subdirectory names (relative to data_root)
mini_dir: asl_clean_mini/
shards_dir: asl_shards/

# Active dataset variant 
dataset_variant: shards # mini or shards

# Raw dataset paths (local preprocessing only, not needed on cluster)
raw_datasets:
  combine_asl: "combine_asl_dataset/"
  asl_hg_raw: "ASL-HG American Sign Language Hand Gesture Image D/ASL-HG American Sign Language Hand Gesture Image D/ASL_HG_36000/ASL_Raw_Images/asl_dataset/"
  asl_alphabet: "archive (2)/asl_alphabet_train/asl_alphabet_train/"

# ---------------------------------------------------------------------------
