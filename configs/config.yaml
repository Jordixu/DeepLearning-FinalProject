# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:
  image_size: 224
  min_image_size: 32
  shard_size: 1000
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  random_seed: 33
  cache_resized: false

# ---------------------------------------------------------------------------
# DataLoader
# ---------------------------------------------------------------------------
dataloader:
  local:
    batch_size: 64
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
    pin_memory: true
  cluster:
    # H100 node: 32 cores auto-allocated per GPU, 80 GB VRAM
    batch_size: 256
    num_workers: 16
    prefetch_factor: 4
    persistent_workers: true
    pin_memory: true

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  num_epochs: 50
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  grad_accum_steps: 1
  use_amp: true                # BF16/FP16, H100 natively supports both
  use_weighted_sampler: false
  use_class_weights: true
  scheduler: cosine
  torch_compile: false         # set true for long production runs (~2 min compile overhead)

# ---------------------------------------------------------------------------
# Transfer learning
# ---------------------------------------------------------------------------
transfer:
  freeze_epochs: 5
  backbones:
    - resnet18
    - resnet50
    - mobilenet_v3_small
    - efficientnet_b0
