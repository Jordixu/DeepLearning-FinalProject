active_env: local   # override with ASL_ENV env var: local | colab | kaggle

# ---------------------------------------------------------------------------
# Paths per execution environment
# ---------------------------------------------------------------------------
# After running reorganize.py locally, upload data/asl_clean/ as a single
# dataset to Kaggle / Google Drive.  All environments then point at asl_clean/.
paths:
  local:
    data_root: data/
    results_root: results/
    checkpoints_root: checkpoints/
  colab:
    # Mount your Drive, then set data_root to wherever asl_clean/ lives.
    data_root: /content/drive/MyDrive/asl/
    results_root: /content/drive/MyDrive/asl/results/
    checkpoints_root: /content/drive/MyDrive/asl/checkpoints/
  kaggle:
    # Upload the repo + asl_clean/ as separate Kaggle datasets (see README).
    # asl_clean/ is read-only under /kaggle/input/; results go to /kaggle/working/.
    data_root: /kaggle/input/asl-clean-data/    # <- UPDATE after upload
    results_root: /kaggle/working/results/
    checkpoints_root: /kaggle/working/checkpoints/

# ---------------------------------------------------------------------------
# Raw dataset locations (local only - used by data_unification.py and
# reorganize.py; not needed on Kaggle/Colab after asl_clean/ is uploaded).
# Paths are relative to paths.local.data_root.
# ---------------------------------------------------------------------------
raw_datasets:
  combine_asl: "combine_asl_dataset/"
  asl_hg_raw: "ASL-HG American Sign Language Hand Gesture Image D/ASL-HG American Sign Language Hand Gesture Image D/ASL_HG_36000/ASL_Raw_Images/asl_dataset/"
  asl_alphabet: "archive (2)/asl_alphabet_train/asl_alphabet_train/"

# ---------------------------------------------------------------------------
# Clean dataset (after reorganize.py runs)
# Path is relative to the active data_root.
# Layout: asl_clean/{split}/{class_name}/{image_file}
# ---------------------------------------------------------------------------
clean_dir: asl_clean/

