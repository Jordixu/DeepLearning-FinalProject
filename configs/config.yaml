# Environment is auto-detected by src/config.py:detect_env().
# Override with the ASL_ENV env var: local | colab | kaggle

# Set to true to enable [DEBUG] prints in dataset.py and training.py
debug: false

# ---------------------------------------------------------------------------
# Paths per execution environment
# ---------------------------------------------------------------------------
# Local layout:
#   data/
#     asl_clean_mini/{train,val,test}/<class>/       <- mini sample (tracked in git)
#     asl_clean/{train,val,test}/<class>/             <- full dataset (local only)
#     asl_shards/{train,val,test}/*.tar               <- WebDataset shards (cloud training)
#     splits/asl_clean_mini/{train,val,test}.csv      <- mini manifests (tracked in git)
#     splits/asl_clean/{train,val,test}.csv           <- full manifests (local only)
#
# Cloud training:
#   1. Run the local preprocessing pipeline to produce data/asl_shards/
#   2. Upload data/ (or just asl_shards/) to your cloud storage
#   3. Set dataset_variant: shards and update data_root below
#
#   Colab: call config.mount_drive() before load_config().
#     Upload data/ to MyDrive/asl/ so that asl_shards/ is at MyDrive/asl/asl_shards/
#
#   Kaggle: add your uploaded dataset; update the slug in data_root below.
#     Expected layout: /kaggle/input/<slug>/asl_shards/{train,val,test}/
paths:
  local:
    data_root: data/
    results_root: results/
    checkpoints_root: checkpoints/
  colab:
    data_root: /content/drive/MyDrive/asl/            # upload data/ here as MyDrive/asl/
    results_root: /content/drive/MyDrive/asl/results/
    checkpoints_root: /content/drive/MyDrive/asl/checkpoints/
  kaggle:
    data_root: /kaggle/input/asl-data/                # <- UPDATE to your dataset slug
    results_root: /kaggle/working/results/
    checkpoints_root: /kaggle/working/checkpoints/

# Raw dataset directories (relative to local data_root).
# Only used by data_unification.py and preprocessing.py (local, no GPU).
raw_datasets:
  combine_asl: "combine_asl_dataset/"
  asl_hg_raw: "ASL-HG American Sign Language Hand Gesture Image D/ASL-HG American Sign Language Hand Gesture Image D/ASL_HG_36000/ASL_Raw_Images/asl_dataset/"
  asl_alphabet: "archive (2)/asl_alphabet_train/asl_alphabet_train/"

# Subdirectory names (relative to data_root)
mini_dir: asl_clean_mini/
clean_dir: asl_clean/
shards_dir: asl_shards/

# ---------------------------------------------------------------------------
# Active dataset variant — change this one line to switch datasets
# ---------------------------------------------------------------------------
#   mini:   data/asl_clean_mini/ + splits/asl_clean_mini/  (small sample, local dev/testing)
#   full:   data/asl_clean/      + splits/asl_clean/       (full dataset, local only)
#   shards: data/asl_shards/                               (WebDataset tars, cloud training)
dataset_variant: mini

