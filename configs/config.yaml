# Environment is auto-detected by src/config.py:detect_env().
# Override with the ASL_ENV env var: local | colab | kaggle

# ---------------------------------------------------------------------------
# Paths per execution environment
# ---------------------------------------------------------------------------
# Local layout after running reorganize.py:
#   data/
#     asl_clean/{train,val,test}/<class>/  ← images
#     splits/{train,val,test}.csv  ← manifests (relative to data/)
#
# Colab: call config.mount_drive() before load_config(), then upload the
#   local data/ folder to Drive as MyDrive/asl_clean/ so the structure mirrors:
#   MyDrive/asl_clean/
#     asl_clean/  splits/  results/  checkpoints/
#
# Kaggle: upload data/ contents as a dataset; asl_clean/ is read-only under
#   /kaggle/input/; results and checkpoints go to /kaggle/working/.
paths:
  local:
    data_root: data/
    results_root: results/
    checkpoints_root: checkpoints/
  colab:
    data_root: /content/drive/MyDrive/asl_clean/
    results_root: /content/drive/MyDrive/asl_clean/results/
    checkpoints_root: /content/drive/MyDrive/asl_clean/checkpoints/
  kaggle:
    data_root: /kaggle/input/asl-clean-data/    # <- UPDATE to your dataset slug
    results_root: /kaggle/working/results/
    checkpoints_root: /kaggle/working/checkpoints/

# Raw dataset directories (relative to data_root)
raw_datasets:
  combine_asl: "combine_asl_dataset/"
  asl_hg_raw: "ASL-HG American Sign Language Hand Gesture Image D/ASL-HG American Sign Language Hand Gesture Image D/ASL_HG_36000/ASL_Raw_Images/asl_dataset/"
